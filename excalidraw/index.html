<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excalidraw previewer</title>
<!-- Excalidraw previewer (bnbloc.previewer.contract/v1). Runs in a sandboxed
     opaque-origin frame: no inline script, no network, assets from the bundle
     only. -->
<link rel="stylesheet" href="excalidraw.css">
<link rel="stylesheet" href="style.css">
<script src="main.js" defer></script>
</head>
<body>
<main id="editor" aria-label="Drawing"></main>
<footer id="bar">
  <p id="status" role="status"></p>
  <div id="actions">
    <div id="draft-box">
      <input id="prompt" type="text" maxlength="1000" placeholder="Describe a diagram to draft with AI" aria-label="Describe a diagram to draft with AI">
      <button id="draft" type="button" disabled>Draft with AI</button>
      <button id="remove-draft" type="button" hidden>Remove draft</button>
    </div>
    <button id="save" type="button" disabled>Save</button>
  </div>
</footer>
</body>
</html>
